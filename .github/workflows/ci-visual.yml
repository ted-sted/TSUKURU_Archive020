name: CI (text + visual)

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # PlaywrightをActions側で確実に動かす（deps込み）
      - run: npx playwright install --with-deps chromium

      - run: npm run text:check
      - run: npm run visual:shots

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: artifacts/screenshots
